name: Build and Push Docker Image

on:
  push:
  # Build new image every day at midnight
  schedule:
    # https://crontab.guru/#0_6_*_*_*
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      FIBER_VERSION:
        description: 'Version of Fiber to build'
        required: false
        default: 'v0.5.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ckb-fiber

jobs:
  get-fiber-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      REPO: nervosnetwork/fiber

    steps:
    - name: Set repository name
      id: repo
      run: |
        repository=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
        echo "repository=${repository}" >> $GITHUB_OUTPUT

    - id: get_fiber_latest_commit
      name: Get the latest commmit on the main branch
      env:
        BRANCH: main
      run: |
        commit_sha=$(curl -s https://api.github.com/repos/$REPO/commits/$BRANCH | jq -r .sha)
        echo "commit_sha=${commit_sha}" >> $GITHUB_OUTPUT

    - name: Check if Docker commit tag exists
      id: check-commit
      # https://github.com/tyriis/docker-image-tag-exists/releases/tag/v2.1.0
      uses: tyriis/docker-image-tag-exists@71a750a41aa78e4efb0842f538140c5df5b8166f
      with:
        registry: ${{ env.REGISTRY }}
        repository: ${{ steps.repo.outputs.repository }}
        tag: fiber-commit-${{ steps.get_fiber_latest_commit.outputs.commit_sha }}
  
    - id: get_fiber_latest_tag
      name: Get the latest tag of fiber
      run: |
        echo "Get latest tag of $REPO"

        tag=$(curl -s https://api.github.com/repos/$REPO/tags | jq -r '.[0].name')
        echo "tag=${tag}" >> $GITHUB_OUTPUT

    - name: Check if Docker tag exists
      id: check-tag
      uses: tyriis/docker-image-tag-exists@71a750a41aa78e4efb0842f538140c5df5b8166f
      with:
        registry: ${{ env.REGISTRY }}
        repository: ${{ steps.repo.outputs.repository }}
        tag: ${{ steps.get_fiber_latest_tag.outputs.tag }}

    - id: set-matrix
      name: Set up matrix
      run: |
        matrix=()

        if [[ "${{ github.event.inputs.FIBER_VERSION }}" != "" ]]; then
          echo "FIBER_VERSION=${{ github.event.inputs.FIBER_VERSION }}"
          matrix[${#matrix[@]}]="${{ github.event.inputs.FIBER_VERSION }}"
        else 
          if [[ "${{ steps.check-commit.outputs.tag }}" != "found" ]]; then
            echo "commit_sha=${{ steps.get_fiber_latest_commit.outputs.commit_sha }}"
            matrix=( "${{ steps.get_fiber_latest_commit.outputs.commit_sha }}" )
          fi

          if [[ "${{ steps.check-tag.outputs.tag }}" != "found" ]]; then
            echo "FIBER_LATEST_TAG=${{ steps.get_fiber_latest_tag.outputs.tag }}"
            matrix[${#matrix[@]}]="${{ steps.get_fiber_latest_tag.outputs.tag }}"
          fi
        fi

        joined=$(printf '"%s",' "${matrix[@]}" | sed 's/,$//')
        formatted_array="[ ${joined} ]"
        echo "$formatted_array"
        echo matrix="$formatted_array" >> $GITHUB_OUTPUT

  build-and-push-docker:
    needs: get-fiber-versions
    # FIXME
    # if: ${{ fromJSON(needs.get-fiber-versions.outputs.matrix).length > 0 }}
    strategy:
      fail-fast: false
      matrix:
        FIBER_VERSION: ${{ fromJSON(needs.get-fiber-versions.outputs.matrix) }}
    env:
      CKB_CLI_VERSION: v1.12.0
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: |
          latest=true
        tags: |
          type=raw,value=fiber-commit-${{ matrix.FIBER_VERSION }}
          type=raw,value=fiber-commit-${{ matrix.FIBER_VERSION }}-ckb-cli-${{ env.CKB_CLI_VERSION }}
          type=raw,value=${{ matrix.FIBER_VERSION }}
          type=raw,value=${{ matrix.FIBER_VERSION }}-ckb-cli-${{ env.CKB_CLI_VERSION }}
          type=ref,event=branch,suffix=-{{date 'YYYYMMDDHHmm'}}
        labels: |
          org.opencontainers.image.source=https://github.com/nervosnetwork/fiber
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build  
      uses: docker/build-push-action@v6  
      with:
        context: .
        build-args: |
          FIBER_VERSION=${{ matrix.FIBER_VERSION }}
          CKB_CLI_VERSION=${{ env.CKB_CLI_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: ${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') }}
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Print image metadata
      run: |
        echo "Image ID: ${{ steps.build.outputs.imageid }}"
        echo "Digest: ${{ steps.build.outputs.digest }}"
        echo "Metadata: ${{ steps.build.outputs.metadata }}"

    outputs:
      imageid: ${{ steps.build.outputs.imageid }}
      digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.build.outputs.metadata }}


  call-reusable-test:
    needs: build-and-push-docker
    uses: ./.github/workflows/reusable-test.yml
    with:
      # TODO: use ${{ github.repository_owner }}
      image: ghcr.io/flouse/ckb-fiber:latest

  call-reusable-test-digest:
    needs: build-and-push-docker
    uses: ./.github/workflows/reusable-test.yml
    with:
      # TODO: use ${{ github.repository_owner }}
      image: ghcr.io/flouse/ckb-fiber@${{ needs.build-and-push-docker.outputs.digest}}
