name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    environment: testnet
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start containers
      run: |
        # Check if the testnet.key is available in GitHub secrets
        if [[ -n "${{ secrets.CKB_TESTNET_KEY }}" ]]; then
          echo "${{ secrets.CKB_TESTNET_KEY }}" > testnet.key
          echo "Uncommenting the line for testnet.key in docker-compose.yml"
          sed -i 's|# - ./testnet.key:/fiber/.fiber-node/ckb/key:ro|- ./testnet.key:/fiber/.fiber-node/ckb/key:ro|' docker-compose.yml
        fi

        # Start the Docker containers in detached mode
        docker compose up -d

    - name: Wait for services to be healthy
      run: |
        for i in $(seq 1 30); do # Timeout after 30 * 10 = 300 seconds (5 minutes)
          if [[ $(docker compose ps --services --filter "status=running" | wc -l) -eq 1 ]]; then
            echo "Services are running"
            break
          fi
          echo "Waiting for services to start..."
          sleep 10
        done

        docker compose ps

        echo "Checking if the fiber-testnet-node is healthy"
        if [[ $(docker inspect -f '{{.State.Health.Status}}' fiber-testnet-node) != "healthy" ]]; then
          echo "Fiber testnet node is not healthy"
          exit 1
        fi

    # FIXME:
    # - name: Test node connectivity (P2P)
    #   run: |
    #     docker exec fiber-testnet-node nc -vz localhost 8228

    # - name: Test RPC endpoint
    #   run: |
    #     docker exec fiber-testnet-node curl -s -X POST -H "Content-Type: application/json" --data '{"id":2, "jsonrpc":"2.0", "method":"local_node_info", "params":[]}' http://localhost:8227 | jq .

    - name: Stop containers
      if: always()
      run: docker compose down -v
