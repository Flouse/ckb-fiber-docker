# List of enabled services
services:
- fiber
- rpc
- ckb


# Fiber network configuration
fiber:
  # Local P2P network listening address
  listening_addr: "/ip4/0.0.0.0/tcp/8228"
  # Whether to announce your listening address to other peers
  announce_listening_addr: true

  # Bootstrap nodes for initial network connection
  bootnode_addrs:
  - "/ip4/54.179.226.154/tcp/8228/p2p/Qmes1EBD4yNo9Ywkfe6eRw9tG1nVNGLDmMud1xJMsoYFKy"
  - "/ip4/54.179.226.154/tcp/18228/p2p/QmdyQWjPtbK4NWWsvy8s69NGJaQULwgeQDT5ZpNDrTNaeV"

  # announced_addrs:
  # If you want to announce your fiber node public address to the network, you need to add the address here, please change the ip to your public ip accordingly.
  # - "/ip4/YOUR-FIBER-NODE-PUBLIC-IP/tcp/8228"

  # chain spec, can be mainnet | testnet | "path to chain spec file"
  chain: testnet

  # lock script configurations related to fiber network
  # https://github.com/nervosnetwork/fiber-scripts/blob/main/deployment/testnet/migrations/2025-02-28-111246.json
  scripts:
  - name: FundingLock
    script:
      code_hash: 0x6c67887fe201ee0c7853f1682c0b77c0e6214044c156c7558269390a8afa6d7c
      hash_type: type
      args: 0x
    cell_deps:
    - type_id:
        code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
        hash_type: type
        args: 0x3cb7c0304fe53f75bb5727e2484d0beae4bd99d979813c6fc97c3cca569f10f6
    - cell_dep:
        out_point:
          tx_hash: 0x5a5288769cecde6451cb5d301416c297a6da43dc3ac2f3253542b4082478b19b # ckb_auth
          index: 0x0
        dep_type: code
  - name: CommitmentLock
    script:
      code_hash: 0x740dee83f87c6f309824d8fd3fbdd3c8380ee6fc9acc90b1a748438afcdf81d8
      hash_type: type
      args: 0x
    cell_deps:
    - type_id:
        code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
        hash_type: type
        args: 0xf7e458887495cf70dd30d1543cad47dc1dfe9d874177bf19291e4db478d5751b
    - cell_dep:
        out_point:
          tx_hash: 0x5a5288769cecde6451cb5d301416c297a6da43dc3ac2f3253542b4082478b19b #ckb_auth
          index: 0x0
        dep_type: code
# RPC service configuration
rpc:
  # RPC server listening address
  # Since this config is used in a docker container, we allow all machines to access the RPC port.
  listening_addr: "0.0.0.0:8227"


